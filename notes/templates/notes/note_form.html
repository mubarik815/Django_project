
{% extends 'notes/base.html' %}

{% block content %}

<h2>{{ title }}</h2>

<p>Logged in as: <strong>{{ request.user.username }}</strong></p>

<form method="post">
    {% csrf_token %}

    {{ form.as_p }}

    <button type="submit">Save Note</button>

    <a href="{% url 'note_list' %}">Cancel</a>
</form>

{% endblock %}
